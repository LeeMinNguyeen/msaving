# A version tag on main (v1.2.0) publishes the image for amd64 and arm64 to
# GitHub Container Registry, as ghcr.io/leeminnguyeen/msaving:1.2.0, :1.2 and
# :latest. docker-compose.yml runs :latest unless MSAVING_VERSION says otherwise.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  image:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Only tags on main
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/leeminnguyeen/msaving
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: MSAVING_VERSION=${{ steps.meta.outputs.version }}
