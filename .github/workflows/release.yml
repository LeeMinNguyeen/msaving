# A version tag on main (v1.2.0) makes a GitHub release, with notes from the
# merged pull requests. No images are published: each server builds from its
# own checkout, and servers learn about the release from GitHub's releases.
# The tag must match the VERSION file (bumped in the release pull request).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  release:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Only tags on main, matching VERSION
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
