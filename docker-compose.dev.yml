# Development only (never for operators): the built-in database on this
# machine's port 5433, so backend/scripts/dev.sh can run the API from source
# with --reload against it.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d db
services:
  db:
    ports:
      - "127.0.0.1:5433:5432"
