# Lint, type check, tests (including the vi/en string files' keys) and a build
# on every pull request and every push to the protected branches. Deploys come
# when the web host is chosen.
name: CI

on:
  pull_request:
  push:
    branches: [dev, staging, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      # Placeholders so the build runs; each environment's real values are set where it deploys.
      VITE_API_URL: https://api.example.invalid
      VITE_SITE_URL: https://site.example.invalid
      VITE_SUPABASE_URL: https://supabase.example.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
