# Merge to staging → development, merge to main → production (Firebase Hosting).
# Off until the repository variable DEPLOY_ENABLED is "true". Per GitHub
# environment ("development", "production"), variables: GCP_PROJECT_ID,
# GCP_WIF_PROVIDER, GCP_DEPLOYER_SA, VITE_API_URL, VITE_SITE_URL,
# VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY (public values only).
name: Deploy

on:
  push:
    branches: [staging, main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      FIREBASE_SITE: ${{ vars.GCP_PROJECT_ID }}-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm test && npm run build
      - run: node scripts/firebase-json.mjs
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - run: npx --yes firebase-tools@15 deploy --only hosting --project "${{ vars.GCP_PROJECT_ID }}" --non-interactive
