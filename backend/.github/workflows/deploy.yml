# Merge to staging → development, merge to main → production, in this order:
# tests, then `supabase db push`, then the new image for the API and the jobs
# on Cloud Run, then the API's Firebase Hosting site. If a step fails, nothing
# after it runs (msaving-docs, Branches and pull requests).
#
# Off until the repository variable DEPLOY_ENABLED is "true" (set it once the
# environment exists; msaving-docs Cloud setup). Per GitHub environment
# ("development", "production"):
#   variables: GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_DEPLOYER_SA, SUPABASE_PROJECT_REF
#   secrets:   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD
name: Deploy

on:
  push:
    branches: [staging, main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  migrate:
    needs: test
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" --password "$SUPABASE_DB_PASSWORD"
      # Development gets seed.sql (the placeholder privacy policy); production never does.
      - run: supabase db push --password "$SUPABASE_DB_PASSWORD" ${{ github.ref_name == 'staging' && '--include-seed' || '' }}

  deploy:
    needs: migrate
    runs-on: ubuntu-24.04
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      REGION: asia-southeast1
      IMAGE: asia-southeast1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/msaving/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - run: docker build -t "$IMAGE" . && docker push "$IMAGE"
      - name: API
        # update, not deploy: deploy would create a missing service as the default
        # compute account with no secrets. Terraform creates it (run_services = true).
        run: gcloud run services update api --image "$IMAGE" --region "$REGION" --project "${{ vars.GCP_PROJECT_ID }}" --quiet
      - name: Jobs
        run: |
          for job in fx purge backup; do
            gcloud run jobs update "$job" --image "$IMAGE" --region "$REGION" --project "${{ vars.GCP_PROJECT_ID }}" --quiet
          done
      - name: API site on Firebase Hosting
        working-directory: infra/firebase
        run: |
          sed -i "s/__API_SITE__/${{ vars.GCP_PROJECT_ID }}-api/" firebase.json
          npx --yes firebase-tools@15 deploy --only hosting --project "${{ vars.GCP_PROJECT_ID }}" --non-interactive
